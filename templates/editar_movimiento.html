{% extends "base.html" %}
{% block title %}Editar movimiento{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body quick-form">
                <h5 class="card-title mb-3"><i class="bi bi-pencil text-secondary"></i> Editar movimiento</h5>

                <form method="POST" action="{{ url_for('editar_movimiento', mov_id=mov.id) }}">
                    <div class="btn-group w-100 mb-3" role="group">
                        <input type="radio" class="btn-check" name="type" id="tipoIngreso" value="ingreso" autocomplete="off" {{ 'checked' if mov.type == 'ingreso' }}>
                        <label class="btn btn-outline-success" for="tipoIngreso"><i class="bi bi-arrow-down-circle"></i> Ingreso</label>

                        <input type="radio" class="btn-check" name="type" id="tipoGasto" value="gasto" autocomplete="off" {{ 'checked' if mov.type == 'gasto' }}>
                        <label class="btn btn-outline-danger" for="tipoGasto"><i class="bi bi-arrow-up-circle"></i> Gasto</label>

                        <input type="radio" class="btn-check" name="type" id="tipoAhorro" value="ahorro" autocomplete="off" {{ 'checked' if mov.type == 'ahorro' }}>
                        <label class="btn btn-outline-primary" for="tipoAhorro"><i class="bi bi-piggy-bank"></i> Ahorro</label>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Monto (COP)</label>
                        <input type="number" step="1" min="1" name="amount" class="form-control amount-input" value="{{ mov.amount|int }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoría</label>
                        <select name="category_id" id="selectCategoria" class="form-select" required>
                            {% for c in categorias if c.type == mov.type %}
                                <option value="{{ c.id }}" {{ 'selected' if c.id == mov.category_id }}>{{ c.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Cuenta / Efectivo de origen</label>
                        <select name="account_id" class="form-select" required>
                            {% for a in cuentas %}
                                <option value="{{ a.id }}" {{ 'selected' if a.id == mov.account_id }}>{{ a.name }} ({{ a.type|capitalize }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Fecha real</label>
                        <input type="date" name="date" class="form-control" value="{{ mov.date.isoformat() }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción (opcional)</label>
                        <input type="text" name="description" class="form-control" value="{{ mov.description or '' }}" maxlength="255">
                    </div>

                    <div class="mb-3 p-2 bg-light rounded border">
                        <label class="form-label small fw-semibold mb-2">Mes de presupuesto al que pertenece</label>
                        <div class="row g-2">
                            <div class="col-7">
                                <select name="budget_month" class="form-select form-select-sm">
                                    {% for m in range(1, 13) %}
                                        <option value="{{ m }}" {{ 'selected' if m == mov.budget_month }}>{{ nombre_mes(m) }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-5">
                                <select name="budget_year" class="form-select form-select-sm">
                                    {% for y in range(mov.date.year - 2, mov.date.year + 3) %}
                                        <option value="{{ y }}" {{ 'selected' if y == mov.budget_year }}>{{ y }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="form-text">Cambia esto si el gasto/ingreso debe contarse en el Dashboard de un mes distinto al de la fecha real.</div>
                    </div>

                    <div class="d-flex gap-2">
                        <a href="{{ request.referrer or url_for('movimientos') }}" class="btn btn-outline-secondary flex-grow-1">Cancelar</a>
                        <button type="submit" class="btn btn-success flex-grow-1">
                            <i class="bi bi-check-circle"></i> Guardar cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
